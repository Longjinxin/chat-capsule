# 自动打包：push 到 main 或推送 v* 标签时，构建 Windows portable exe
# - 每次 push：构建产物上传为 Actions Artifact（仓库 Actions 页可下载）
# - 推送 v* 标签（如 v0.1.0）：额外创建 GitHub Release 并附上 exe

name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: # 允许在 Actions 页面手动触发

jobs:
  build:
    # 固定 windows-2022（VS2022）：windows-latest 已升级到 VS18，
    # @electron/node-gyp 尚无法识别，会导致 better-sqlite3 编译失败。
    runs-on: windows-2022
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖（自动重编译 better-sqlite3 到 Electron ABI）
        run: npm ci

      - name: 构建主进程与渲染进程
        run: npm run build

      - name: 打包 Windows portable exe
        run: npx electron-builder --win --publish never
        env:
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: chat-capsule-windows-portable
          path: release/*.exe
          if-no-files-found: error

      - name: 发布 GitHub Release（仅 v* 标签触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
